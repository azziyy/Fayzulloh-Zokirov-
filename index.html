<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="Premium Music Platform - Professional Artist Music App">
    <title>Music Platform - Premium Artist Music App</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --primary: #1DB954;
            --primary-dark: #1ed760;
            --bg-dark: #0f0f0f;
            --bg-secondary: #181818;
            --bg-tertiary: #282828;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(20, 20, 20, 0.8);
            --glass-border: rgba(255, 255, 255, 0.15);
            --transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ===== GLOBAL STYLES ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ===== LOADING SCREEN ===== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            animation: fadeOutLoading 0.8s ease forwards 2.5s;
        }

        @keyframes fadeOutLoading {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            position: relative;
        }

        .loading-logo::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, var(--primary), transparent 50%);
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .loading-logo::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            background: var(--bg-dark);
            border-radius: 50%;
            top: 20%;
            left: 20%;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: var(--primary);
            margin-top: 10px;
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .floating-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle 20s infinite linear;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* ===== MAIN APP ===== */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }

        /* ===== CONTENT AREA ===== */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 80px;
            position: relative;
            scroll-behavior: smooth;
        }

        .content-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            background: rgba(20, 20, 20, 0.5);
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 20px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* ===== STORIES SECTION ===== */
        .stories-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(20, 20, 20, 0.3);
        }

        .stories-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .stories-container::-webkit-scrollbar {
            height: 3px;
        }

        .story-item {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: var(--transition);
        }

        .story-item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid transparent;
            animation: storyGlow 3s ease-in-out infinite;
        }

        @keyframes storyGlow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(29, 185, 84, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(29, 185, 84, 0.6));
            }
        }

        .story-item:hover .story-item-image {
            transform: scale(1.05);
        }

        .story-skeleton {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(90deg, var(--bg-tertiary), var(--bg-secondary), var(--bg-tertiary));
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
        }

        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== SONGS SECTION ===== */
        .category-section {
            padding: 16px;
            margin-bottom: 8px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* ===== CAROUSEL CARDS ===== */
        .carousel-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-container::-webkit-scrollbar {
            height: 4px;
        }

        .carousel-item {
            flex-shrink: 0;
            width: 160px;
            height: 200px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-secondary);
        }

        .carousel-item:hover {
            transform: translateY(-8px);
        }

        .carousel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .carousel-item:hover .carousel-image {
            transform: scale(1.1);
            filter: blur(2px) brightness(0.8);
        }

        .carousel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent 60%, rgba(0, 0, 0, 0.8));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            opacity: 0;
            transition: var(--transition);
        }

        .carousel-item:hover .carousel-overlay {
            opacity: 1;
        }

        .carousel-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            opacity: 0;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
            cursor: pointer;
        }

        .carousel-item:hover .carousel-play-btn {
            opacity: 1;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .carousel-text {
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carousel-artist {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== GRID CARDS ===== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .grid-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: var(--bg-secondary);
            transition: var(--transition);
        }

        .grid-item:active {
            transform: scale(0.95);
        }

        .grid-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .grid-item:hover .grid-image {
            transform: scale(1.08);
            filter: brightness(0.7);
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            opacity: 0;
            transition: var(--transition);
        }

        .grid-item:hover .grid-overlay {
            opacity: 1;
        }

        .grid-play-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            opacity: 0;
            transform: scale(0);
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(29, 185, 84, 0.4);
            cursor: pointer;
        }

        .grid-item:hover .grid-play-btn {
            opacity: 1;
            transform: scale(1);
        }

        .grid-text {
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-artist {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== LIST CARDS ===== */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-color);
        }

        .list-item:active {
            transform: scale(0.98);
        }

        .list-image {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
        }

        .list-content {
            flex: 1;
            min-width: 0;
        }

        .list-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-artist {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-duration {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 30px;
            text-align: right;
        }

        .list-menu {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            font-size: 18px;
        }

        .list-menu:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== SKELETON LOADING ===== */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary), var(--bg-secondary), var(--bg-tertiary));
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 8px;
        }

        .skeleton-carousel {
            width: 160px;
            height: 200px;
            flex-shrink: 0;
            border-radius: 12px;
        }

        .skeleton-grid {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
        }

        /* ===== BOTTOM NAVIGATION ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 8px;
            z-index: 100;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
            padding-bottom: 8px;
            position: relative;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 24px;
            transition: var(--transition);
        }

        .nav-item.active .nav-icon {
            font-size: 26px;
            filter: drop-shadow(0 0 6px rgba(29, 185, 84, 0.5));
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            right: 25%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
            opacity: 0;
            transition: var(--transition);
        }

        .nav-item.active::before {
            opacity: 1;
        }

        /* ===== MODAL STYLES ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.4s ease;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== PLAYER MODAL ===== */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0f0f 100%);
            z-index: 250;
            display: none;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        .player-modal.active {
            display: flex;
        }

        .player-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-title {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .player-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .player-cover {
            width: 280px;
            height: 280px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(29, 185, 84, 0.3);
            animation: slideDown 0.6s ease;
        }

        .vinyl-animation {
            animation: spin 3s linear infinite;
        }

        .player-info {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .player-song-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .player-artist-name {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .player-progress {
            width: 100%;
            margin-bottom: 30px;
        }

        .player-seekbar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .player-seekbar:hover {
            height: 6px;
        }

        .player-seekbar-progress {
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .player-seekbar-progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.6);
        }

        .player-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: var(--transition);
            color: var(--text-primary);
        }

        .player-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .player-btn:active {
            transform: scale(0.95);
        }

        .player-play-btn {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border: none;
            font-size: 28px;
            color: var(--bg-dark);
            box-shadow: 0 8px 32px rgba(29, 185, 84, 0.4);
        }

        .player-play-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 12px 40px rgba(29, 185, 84, 0.6);
        }

        .player-volume {
            width: 100%;
            max-width: 200px;
            margin-bottom: 30px;
        }

        .volume-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.6);
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.6);
        }

        .player-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            width: 100%;
            margin-bottom: 30px;
        }

        .visualizer-bar {
            width: 4px;
            background: var(--primary);
            border-radius: 2px;
            animation: visualizerBar 0.6s ease-in-out infinite;
        }

        @keyframes visualizerBar {
            0%, 100% { height: 8px; }
            50% { height: 30px; }
        }

        /* ===== NEWS CARDS ===== */
        .news-card {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-secondary);
            margin-bottom: 12px;
            border: 1px solid transparent;
        }

        .news-card:hover {
            border-color: var(--border-color);
            transform: translateY(-4px);
        }

        .news-image {
            width: 100%;

    <script>
        // ===== APPLICATION STATE =====
        const APP = {
            currentTab: 'songs',
            currentSongIndex: 0,
            isPlaying: false,
            isShuffle: false,
            repeatMode: 0,
            volume: 70,
            songs: [],
            news: [],
            profile: {},
            stories: [],
            currentStoryIndex: 0,
            playlistQueue: [],
            likedSongs: new Set(),
            recentlyPlayed: [],
            touchStartY: 0,
        };

        // ===== GOOGLE SHEETS CONFIG =====
        const SHEETS_CONFIG = {
            SID: '1GAIOHuWNt6cfPvTrHvBrK_Hk92Jc_JlMdtzeUFhcisw',
            GID_SONGS: '0',
            GID_NEWS: '1698017317',
            GID_PROFILE: '678047652',
            GID_STORY: '10300380',
        };

        // CSV URL Generators
        function getCsvUrl(gid) {
            return `https://docs.google.com/spreadsheets/d/${SHEETS_CONFIG.SID}/export?format=csv&gid=${gid}`;
        }

        // ===== CSV PARSER =====
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const rows = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const cells = [];
                let currentCell = '';
                let insideQuotes = false;

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    const nextChar = line[j + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentCell += '"';
                            j++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        cells.push(currentCell);
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }

                if (currentCell || cells.length > 0) {
                    cells.push(currentCell);
                    rows.push(cells);
                }
            }

            return rows;
        }

        // ===== DATA LOADING =====
        async function loadData() {
            try {
                const songsResponse = await fetch(getCsvUrl(SHEETS_CONFIG.GID_SONGS));
                const songsText = await songsResponse.text();
                const songsData = parseCSV(songsText);
                processSongsData(songsData);

                const newsResponse = await fetch(getCsvUrl(SHEETS_CONFIG.GID_NEWS));
                const newsText = await newsResponse.text();
                const newsData = parseCSV(newsText);
                processNewsData(newsData);

                const profileResponse = await fetch(getCsvUrl(SHEETS_CONFIG.GID_PROFILE));
                const profileText = await profileResponse.text();
                const profileData = parseCSV(profileText);
                processProfileData(profileData);

                const storyResponse = await fetch(getCsvUrl(SHEETS_CONFIG.GID_STORY));
                const storyText = await storyResponse.text();
                const storyData = parseCSV(storyText);
                processStoryData(storyData);

                initializeApp();

            } catch (error) {
                console.error('Error loading data:', error);
                showErrorState('Маълумотларни юклаш турли ўзарирка қўлади');
            }
        }

        function processSongsData(data) {
            for (let i = 1; i < data.length; i++) {
                const [category, cardType, title, artist, imageUrl, audioUrl] = data[i];
                if (title && artist) {
                    APP.songs.push({
                        id: `song-${i}`,
                        category: category?.trim() || 'Қўшиқлар',
                        cardType: cardType?.trim().toLowerCase() || 'list',
                        title: title.trim(),
                        artist: artist.trim(),
                        image: imageUrl?.trim() || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E',
                        audio: audioUrl?.trim() || '',
                        duration: '3:45',
                    });
                }
            }

            APP.playlistQueue = [...APP.songs];
        }

        function processNewsData(data) {
            for (let i = 1; i < data.length; i++) {
                const [date, title, author, imageUrl] = data[i];
                if (title) {
                    APP.news.push({
                        id: `news-${i}`,
                        date: date?.trim() || new Date().toLocaleDateString('uz-UZ'),
                        title: title.trim(),
                        author: author?.trim() || 'Фарғона Сўнгги',
                        image: imageUrl?.trim() || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22400%22 height=%22200%22/%3E%3C/svg%3E',
                        text: 'Бу янгиликлар учун маълумотни қўй боримиз',
                    });
                }
            }
        }

        function processProfileData(data) {
            if (data.length > 1) {
                const [name, bio, image, instagram, telegram, youtube, phone] = data[1];
                APP.profile = {
                    name: name?.trim() || 'Художник',
                    bio: bio?.trim() || 'Сўнгги мусиқачи',
                    image: image?.trim() || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E',
                    instagram: instagram?.trim() || 'https://instagram.com',
                    telegram: telegram?.trim() || 'https://t.me',
                    youtube: youtube?.trim() || 'https://youtube.com',
                    phone: phone?.trim() || '+998',
                };
            }
        }

        function processStoryData(data) {
            for (let i = 1; i < data.length; i++) {
                const [name, image, link] = data[i];
                if (image) {
                    APP.stories.push({
                        id: `story-${i}`,
                        name: name?.trim() || `Қўшиқ ${i}`,
                        image: image.trim(),
                        link: link?.trim() || '#',
                    });
                }
            }
        }

        // ===== UI RENDERING =====
        function renderSongsSection() {
            const container = document.getElementById('songsSection');
            container.innerHTML = '';

            if (APP.stories.length > 0) {
                const storiesHTML = `
                    <div class="stories-section">
                        <div class="stories-container">
                            ${APP.stories.map((story, idx) => `
                                <div class="story-item" onclick="openStoryViewer(${idx})">
                                    <img class="story-item-image" src="${story.image}" alt="${story.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%231DB954%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML += storiesHTML;
            }

            const categories = {};
            APP.songs.forEach(song => {
                if (!categories[song.category]) {
                    categories[song.category] = [];
                }
                categories[song.category].push(song);
            });

            Object.entries(categories).forEach(([category, songs]) => {
                const categoryHTML = `<div class="category-section">`;
                let contentHTML = '';

                if (Object.keys(categories).indexOf(category) === 0) {
                    contentHTML += `
                        <div style="margin-bottom: 16px;">
                            <button class="icon-btn" style="width: auto; padding: 8px 16px; border-radius: 20px; font-weight: 600;" onclick="openPlaylist()">
                                ▶ Барчаси
                            </button>
                        </div>
                    `;
                }

                contentHTML += `<div class="category-title">${category}</div>`;

                const grouped = {};
                songs.forEach(song => {
                    const type = song.cardType || 'list';
                    if (!grouped[type]) grouped[type] = [];
                    grouped[type].push(song);
                });

                Object.entries(grouped).forEach(([type, items]) => {
                    if (type === 'carousel') {
                        contentHTML += renderCarousel(items);
                    } else if (type === 'grid') {
                        contentHTML += renderGrid(items);
                    } else {
                        contentHTML += renderList(items);
                    }
                });

                container.innerHTML += categoryHTML + contentHTML + '</div>';
            });
        }

        function renderCarousel(songs) {
            return `
                <div class="carousel-container">
                    ${songs.map((song, idx) => `
                        <div class="carousel-item" onclick="playSong(${APP.songs.indexOf(song)})">
                            <img class="carousel-image" src="${song.image}" alt="${song.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                            <div class="carousel-overlay">
                                <div class="carousel-text">${song.title}</div>
                                <div class="carousel-artist">${song.artist}</div>
                            </div>
                            <div class="carousel-play-btn" onclick="event.stopPropagation(); playSong(${APP.songs.indexOf(song)})">▶</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderGrid(songs) {
            return `
                <div class="grid-container">
                    ${songs.map((song, idx) => `
                        <div class="grid-item" onclick="playSong(${APP.songs.indexOf(song)})">
                            <img class="grid-image" src="${song.image}" alt="${song.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                            <div class="grid-overlay">
                                <div class="grid-text">${song.title}</div>
                                <div class="grid-artist">${song.artist}</div>
                            </div>
                            <div class="grid-play-btn" onclick="event.stopPropagation(); playSong(${APP.songs.indexOf(song)})">▶</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderList(songs) {
            return `
                <div class="list-container">
                    ${songs.map((song, idx) => `
                        <div class="list-item" onclick="playSong(${APP.songs.indexOf(song)})">
                            <img class="list-image" src="${song.image}" alt="${song.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23282828%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                            <div class="list-content">
                                <div class="list-title">${song.title}</div>
                                <div class="list-artist">${song.artist}</div>
                            </div>
                            <div class="list-duration">${song.duration}</div>
                            <div class="list-menu" onclick="event.stopPropagation()">⋯</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderNewsSection() {
            const container = document.getElementById('newsSection');
            container.innerHTML = '';

            if (APP.news.length === 0) {
                container.innerHTML = '<div class="error-state"><div class="error-icon">📰</div><div class="error-title">Янгиликлар йўқ</div></div>';
                return;
            }

            const newsHTML = APP.news.map(news => `
                <div class="news-card" onclick="openNewsModal('${news.id}')">
                    <img class="news-image" src="${news.image}" alt="${news.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect fill=%22%23282828%22 width=%22400%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="news-content">
                        <div class="news-date">${news.date}</div>
                        <div class="news-title">${news.title}</div>
                        <div class="news-author">• ${news.author}</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div style="padding: 16px; padding-bottom: 80px;">${newsHTML}</div>`;
        }

        function renderProfileSection() {
            const container = document.getElementById('profileSection');

            if (!APP.profile.name) {
                container.innerHTML = '<div class="error-state"><div class="error-icon">👤</div><div class="error-title">Профил маълумоти йўқ</div></div>';
                return;
            }

            const profileHTML = `
                <div class="profile-header">
                    <div class="profile-background"></div>
                    <div class="profile-image-container">
                        <img class="profile-image" src="${APP.profile.image}" alt="${APP.profile.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%221DB954%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'">
                        <div class="profile-verified">✓</div>
                    </div>
                    <div class="profile-name">${APP.profile.name}</div>
                    <div class="profile-bio">${APP.profile.bio}</div>

                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-number">2.5M</div>
                            <div class="stat-label">Кишилар</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">156</div>
                            <div class="stat-label">Қўшиқлар</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">45</div>
                            <div class="stat-label">Альбомлар</div>
                        </div>
                    </div>

                    <div class="profile-social">
                        <a class="social-btn" href="${APP.profile.instagram}" target="_blank">📱 Instagram</a>
                        <a class="social-btn" href="${APP.profile.telegram}" target="_blank">✈️ Telegram</a>
                        <a class="social-btn" href="${APP.profile.youtube}" target="_blank">🎬 YouTube</a>
                        <a class="social-btn" href="tel:${APP.profile.phone}">📞 Қўйрик</a>
                    </div>

                    <div class="profile-genres">
                        <div class="genres-title">Жанрлар</div>
                        <div class="genres-list">
                            <div class="genre-badge">Поп</div>
                            <div class="genre-badge">Хип-Хоп</div>
                            <div class="genre-badge">Электро</div>
                            <div class="genre-badge">R&B</div>
                        </div>
                    </div>
                </div>
                <div style="height: 40px;"></div>
            `;

            container.innerHTML = profileHTML;
        }

        // ===== PLAYBACK CONTROL =====
        function playSong(index) {
            APP.currentSongIndex = index;
            const song = APP.songs[index];

            if (!song) return;

            document.getElementById('playerSongName').textContent = song.title;
            document.getElementById('playerArtistName').textContent = song.artist;
            document.getElementById('playerCover').src = song.image;

            if (!APP.recentlyPlayed.includes(index)) {
                APP.recentlyPlayed.unshift(index);
                if (APP.recentlyPlayed.length > 20) APP.recentlyPlayed.pop();
            }

            APP.isPlaying = true;
            updatePlayerUI();
            openPlayer();
            simulateAudioPlayback();

            if (navigator.vibrate) {
                navigator.vibrate([30]);
            }
        }

        function togglePlay() {
            APP.isPlaying = !APP.isPlaying;
            updatePlayerUI();

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        function nextSong() {
            let nextIndex;
            if (APP.isShuffle) {
                nextIndex = Math.floor(Math.random() * APP.playlistQueue.length);
            } else {
                nextIndex = (APP.currentSongIndex + 1) % APP.playlistQueue.length;
            }
            playSong(nextIndex);

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        function prevSong() {
            const prevIndex = (APP.currentSongIndex - 1 + APP.playlistQueue.length) % APP.playlistQueue.length;
            playSong(prevIndex);

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        function toggleShuffle() {
            APP.isShuffle = !APP.isShuffle;
            document.getElementById('shuffleBtn').style.color = APP.isShuffle ? 'var(--primary)' : 'var(--text-primary)';
            document.getElementById('shuffleBtn').style.opacity = APP.isShuffle ? '1' : '0.7';

            if (navigator.vibrate) {
                navigator.vibrate([20, 10, 20]);
            }
        }

        function toggleRepeat() {
            APP.repeatMode = (APP.repeatMode + 1) % 3;
            const repeatBtn = document.getElementById('repeatBtn');

            if (APP.repeatMode === 0) {
                repeatBtn.textContent = '🔁';
                repeatBtn.style.opacity = '0.7';
            } else if (APP.repeatMode === 1) {
                repeatBtn.textContent = '🔁';
                repeatBtn.style.color = 'var(--primary)';
                repeatBtn.style.opacity = '1';
            } else {
                repeatBtn.textContent = '🔂';
                repeatBtn.style.color = 'var(--primary)';
                repeatBtn.style.opacity = '1';
            }

            if (navigator.vibrate) {
                navigator.vibrate([20, 10, 20]);
            }
        }

        function simulateAudioPlayback() {
            let currentTime = 0;
            const duration = 225;

            const updateInterval = setInterval(() => {
                if (!APP.isPlaying) {
                    clearInterval(updateInterval);
                    return;
                }

                currentTime += 0.1;

                if (currentTime >= duration) {
                    currentTime = 0;
                    if (APP.repeatMode === 2) {
                        // Repeat one
                    } else {
                        nextSong();
                    }
                    clearInterval(updateInterval);
                    return;
                }

                const progressPercent = (currentTime / duration) * 100;
                document.getElementById('playerProgress').style.width = progressPercent + '%';
                document.getElementById('playerCurrentTime').textContent = formatTime(currentTime);
                document.getElementById('playerDuration').textContent = formatTime(duration);
            }, 100);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updatePlayerUI() {
            const playBtn = document.getElementById('playerPlayBtn');
            playBtn.textContent = APP.isPlaying ? '⏸' : '▶';
        }

        // ===== MODAL CONTROLS =====
        function openPlayer() {
            document.getElementById('playerModal').classList.add('active');
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.remove('active');
        }

        function openPlaylist() {
            const playlistBody = document.getElementById('playlistBody');
            playlistBody.innerHTML = APP.playlistQueue.map((song, idx) => `
                <div class="playlist-item" onclick="playSong(${APP.songs.indexOf(song)})">
                    <img class="playlist-item-image" src="${song.image}" alt="${song.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23282828%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'">
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${song.title}</div>
                        <div class="playlist-item-artist">${song.artist}</div>
                    </div>
                    <div class="playlist-item-like" onclick="event.stopPropagation(); toggleLike(${APP.songs.indexOf(song)})">
                        ${APP.likedSongs.has(APP.songs.indexOf(song)) ? '❤️' : '🤍'}
                    </div>
                </div>
            `).join('');

            document.getElementById('playlistModal').classList.add('active');
        }

        function closePlaylist() {
            document.getElementById('playlistModal').classList.remove('active');
        }

        function shufflePlaylist() {
            APP.playlistQueue = [...APP.playlistQueue].sort(() => Math.random() - 0.5);
            openPlaylist();
        }

        function toggleRepeatMode() {
            toggleRepeat();
        }

        function toggleLike(index) {
            if (APP.likedSongs.has(index)) {
                APP.likedSongs.delete(index);
            } else {
                APP.likedSongs.add(index);
            }

            openPlaylist();

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        // ===== STORY VIEWER =====
        function openStoryViewer(index) {
            APP.currentStoryIndex = index;
            const story = APP.stories[index];

            if (!story) return;

            document.getElementById('storyViewerImage').src = story.image;
            document.getElementById('storyViewer').classList.add('active');

            setTimeout(() => {
                if (APP.currentStoryIndex === index) {
                    nextStory();
                }
            }, 5000);

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        function closeStoryViewer() {
            document.getElementById('storyViewer').classList.remove('active');
        }

        function nextStory() {
            if (APP.currentStoryIndex < APP.stories.length - 1) {
                openStoryViewer(APP.currentStoryIndex + 1);
            } else {
                closeStoryViewer();
            }
        }

        function prevStory() {
            if (APP.currentStoryIndex > 0) {
                openStoryViewer(APP.currentStoryIndex - 1);
            }
        }

        // ===== NEWS MODAL =====
        function openNewsModal(newsId) {
            const news = APP.news.find(n => n.id === newsId);
            if (!news) return;

            document.getElementById('newsModalImage').src = news.image;
            document.getElementById('newsModalTitle').textContent = news.title;
            document.getElementById('newsModalDate').textContent = news.date;
            document.getElementById('newsModalAuthor').textContent = 'Муаллиф: ' + news.author;
            document.getElementById('newsModalText').textContent = news.text;

            document.getElementById('newsModal').classList.add('active');

            if (navigator.vibrate) {
                navigator.vibrate([20]);
            }
        }

        function closeNewsModal() {
            document.getElementById('newsModal').classList.remove('active');
        }

        function shareNews() {
            alert('Янгиликни уяли қилиш...');
        }

        function saveNews() {
            alert('Янгилик сақланди!');
        }

        // ===== NAVIGATION =====
        function switchTab(tab) {
            APP.currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            document.getElementById('songsSection').style.display = 'none';
            document.getElementById('newsSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'none';

            switch (tab) {
                case 'songs':
                    document.getElementById('songsSection').style.display = 'block';
                    document.getElementById('pageTitle').textContent = 'Қўшиқлар';
                    break;
                case 'news':
                    document.getElementById('newsSection').style.display = 'block';
                    document.getElementById('pageTitle').textContent = 'Янгиликлар';
                    break;
                case 'profile':
                    document.getElementById('profileSection').style.display = 'block';
                    document.getElementById('pageTitle').textContent = 'Профил';
                    break;
            }

            document.getElementById('contentWrapper').scrollTop = 0;

            if (navigator.vibrate) {
                navigator.vibrate([30, 10, 30]);
            }
        }

        // ===== ERROR HANDLING =====
        function showErrorState(message) {
            const container = document.getElementById('songsSection');
            container.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">Оопа!</div>
                    <div class="error-text">${message}</div>
                    <button class="error-btn" onclick="retryLoadData()">Қайта уринаш</button>
                </div>
            `;
        }

        function retryLoadData() {
            document.getElementById('loadingScreen').style.display = 'flex';
            loadData();
        }

        // ===== FLOATING PARTICLES =====
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 15) + 's';
                container.appendChild(particle);
            }
        }

        // ===== LOCAL STORAGE =====
        function saveState() {
            localStorage.setItem('musicAppState', JSON.stringify({
                likedSongs: Array.from(APP.likedSongs),
                recentlyPlayed: APP.recentlyPlayed,
            }));
        }

        function loadState() {
            const saved = localStorage.getItem('musicAppState');
            if (saved) {
                const state = JSON.parse(saved);
                APP.likedSongs = new Set(state.likedSongs || []);
                APP.recentlyPlayed = state.recentlyPlayed || [];
            }
        }

        // ===== INITIALIZATION =====
        function initializeApp() {
            renderSongsSection();
            renderNewsSection();
            renderProfileSection();

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const tab = item.dataset.tab;
                    switchTab(tab);
                });
            });

            document.getElementById('volumeSlider').addEventListener('input', (e) => {
                APP.volume = e.target.value;
            });

            document.getElementById('playlistSearch').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = APP.playlistQueue.filter(song =>
                    song.title.toLowerCase().includes(query) ||
                    song.artist.toLowerCase().includes(query)
                );

                const playlistBody = document.getElementById('playlistBody');
                playlistBody.innerHTML = filtered.map((song) => `
                    <div class="playlist-item" onclick="playSong(${APP.songs.indexOf(song)})">
                        <img class="playlist-item-image" src="${song.image}" alt="${song.title}">
                        <div class="playlist-item-info">
                            <div class="playlist-item-title">${song.title}</div>
                            <div class="playlist-item-artist">${song.artist}</div>
                        </div>
                        <div class="playlist-item-like" onclick="event.stopPropagation(); toggleLike(${APP.songs.indexOf(song)})">
                            ${APP.likedSongs.has(APP.songs.indexOf(song)) ? '❤️' : '🤍'}
                        </div>
                    </div>
                `).join('');
            });

            loadState();
            setInterval(saveState, 10000);

            console.log('App initialized successfully!');
        }

        // ===== STARTUP =====
        window.addEventListener('load', () => {
            createParticles();

            setTimeout(() => {
                loadData();
            }, 2000);
        });

        window.addEventListener('beforeunload', () => {
            saveState();
        });
    </script>
</body>
</html>
